name: Descarga diaria

# Baja los precios SEPA del día, los controla y los guarda.
#   - Los Parquet diarios van como archivos de un Release por mes (datos-AAAA-MM), no a git.
#   - En git solo se commitean los logs (data/ingesta/log_ingesta.csv y data/calidad/log_calidad.csv).
# Decisiones: docs/decisiones.md (5 y 10).

on:
  schedule:
    # 18:00 UTC = 15:00 en Argentina. El portal publica el zip del día alrededor de las 13:20 (16:20 UTC).
    # GitHub puede demorar las corridas programadas hasta una hora en los momentos de mucha carga.
    - cron: "0 18 * * *"
  workflow_dispatch:
    inputs:
      solo_conexion:
        description: "Solo probar que se puede acceder al portal (no descarga ni guarda nada)"
        type: boolean
        default: false
      forzar:
        description: "Reprocesar los días aunque ya estén guardados"
        type: boolean
        default: false

permissions:
  contents: write  # crear Releases, subir archivos y commitear los logs

# Nunca dos corridas a la vez: las dos escribirían los mismos Releases y logs.
concurrency:
  group: descarga-diaria
  cancel-in-progress: false

jobs:
  descarga:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-pipeline.txt

      - name: Instalar dependencias
        run: pip install -r requirements-pipeline.txt

      # Si el servidor del portal bloquea las IP de GitHub, se ve acá en segundos.
      - name: Verificar acceso al portal
        run: python -m src.ingesta --verificar-acceso

      # La ingesta se fija en data/ qué días ya están guardados y compara contra el día anterior.
      # En un runner nuevo data/ está vacía, así que primero se baja lo de los últimos días.
      - name: Bajar los últimos días ya guardados
        if: ${{ !inputs.solo_conexion }}
        run: python -m src.almacen bajar --dias 10

      # Si falla no se corta acá: primero hay que subir lo que sí salió bien y commitear los logs
      # (con el motivo del error). La corrida se marca como fallida en el último paso.
      - name: Descargar, controlar y guardar
        id: ingesta
        if: ${{ !inputs.solo_conexion }}
        continue-on-error: true
        run: python -m src.ingesta ${{ inputs.forzar && '--forzar' || '' }}

      - name: Subir los días nuevos a los Releases
        if: ${{ !inputs.solo_conexion && !cancelled() }}
        run: python -m src.almacen subir ${{ inputs.forzar && '--forzar' || '' }}

      - name: Commitear los logs
        if: ${{ !inputs.solo_conexion && !cancelled() }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ingesta/log_ingesta.csv data/calidad/log_calidad.csv
          if git diff --cached --quiet; then
            echo "Los logs no cambiaron"
          else
            git commit -m "Actualiza los logs de ingesta y calidad ($(date -u +%F))"
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi

      # Una falla de la ingesta (error de calidad, portal sin datos, descarga rota) marca la corrida en rojo
      # y GitHub avisa por mail.
      - name: Marcar la corrida como fallida si la ingesta falló
        if: ${{ steps.ingesta.outcome == 'failure' }}
        run: |
          echo "::error::La ingesta falló. El detalle está en el paso 'Descargar, controlar y guardar' y en data/calidad/log_calidad.csv"
          exit 1
